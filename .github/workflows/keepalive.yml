name: Keepalive
# Supabase Free pausiert das Projekt nach 7 Tagen ohne Aktivität. Dieser Ping alle 2 Tage verhindert das.
# Ruft nur public.keepalive() auf (gibt die Uhrzeit zurück, liest keine Daten).
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
